name: Angular CI/CD

on:
  push:
    branches: [ main ]  # o el nombre de tu rama principal
  pull_request:
    branches: [ main ]  # o el nombre de tu rama principal

concurrency:
  group: ci-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v3

      # 2️⃣ Instalar dependencias
      - name: Instalar dependencias
        run: npm install

      # 3️⃣ Generar build de producción
      - name: Construir proyecto Angular
        run: npm run build --prod

      # 4️⃣ Subir archivos generados al servidor
      - name: Subir archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: dist/ecommerce/browser/*
          target: /home/ecommerce.juandevops.com/public_html

      # 5️⃣ Ejecutar comandos en el servidor (limpieza y reinicio)
      - name: Ejecutar comando en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Despliegue completado en el servidor ✅"
            cd /home/ecommerce.juandevops.com/public_html
            ls -l  # Verifica los archivos
            sudo systemctl restart lsws  # Reiniciar LiteSpeed para aplicar cambios