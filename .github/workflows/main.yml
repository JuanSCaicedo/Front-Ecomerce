name: Angular CI/CD

on:
  push:
    branches: [ main ]  # o el nombre de tu rama principal
  pull_request:
    branches: [ main ]  # o el nombre de tu rama principal

concurrency:
  group: ci-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Construir proyecto Angular
        run: npm run build

      - name: Limpiar directorio destino en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /home/ecommerce.juandevops.com/public_html/*

      - name: Ajustar permisos en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo chown -R $USER:$USER /home/ecommerce.juandevops.com/public_html
            sudo chmod -R 777 /home/ecommerce.juandevops.com/public_html

      - name: Subir archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/ecommerce/browser/*"
          target: "/home/ecommerce.juandevops.com/public_html/"