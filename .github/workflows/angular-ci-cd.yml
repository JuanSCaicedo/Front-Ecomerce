name: Angular CI/CD with CyberPanel

on:
  push:
    branches:
      - "*"  # Ejecuta en cualquier rama
  pull_request:
    types: [closed]  # Ejecuta cuando se hace merge

concurrency:
  group: angular-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona el repositorio
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3️⃣ Instala dependencias
      - name: Install Dependencies
        run: npm install

      # 4️⃣ Genera build de producción
      - name: Build Angular App
        run: npm run build --prod

      # 5️⃣ Sube solo dist/ecommerce/browser al servidor
      - name: Deploy to CyberPanel Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/ecommerce/browser/*"
          target: "/home/ecommerce.juandevops.com/public_html"

      # 6️⃣ Reinicia LiteSpeed para limpiar caché
      - name: Reload LiteSpeed
        run: ssh -i ${{ secrets.SSH_PRIVATE_KEY }} -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'sudo systemctl restart lsws'
